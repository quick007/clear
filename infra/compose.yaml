name: ${COMPOSE_PROJECT_NAME:-groundtruth}

x-service-runtime: &service-runtime
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-node-service: &node-service
  <<: *service-runtime
  image: groundtruth-node:local
  build:
    context: ..
    dockerfile: infra/docker/node-service.Dockerfile

x-example-telemetry: &example-telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  GROUNDTRUTH_INGEST_KEY: ${GROUNDTRUTH_DEMO_INGEST_KEY:-local-demo-ingest-key}

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: groundtruth
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: ${GROUNDTRUTH_POSTGRES_PASSWORD:-local-postgres-password}
    ports:
      - 127.0.0.1:${GROUNDTRUTH_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"]
      interval: 5s # 5 seconds
      timeout: 3s # 3 seconds
      retries: 20
      start_period: 10s # 10 seconds
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  clickhouse:
    image: groundtruth-clickhouse:local
    build:
      context: ..
      dockerfile: infra/docker/clickhouse.Dockerfile
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: groundtruth
      CLICKHOUSE_USER: groundtruth
      CLICKHOUSE_PASSWORD: ${GROUNDTRUTH_CLICKHOUSE_PASSWORD:-local-clickhouse-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - 127.0.0.1:${GROUNDTRUTH_CLICKHOUSE_HTTP_PORT:-8123}:8123
      - 127.0.0.1:${GROUNDTRUTH_CLICKHOUSE_NATIVE_PORT:-9000}:9000
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1"
      interval: 5s # 5 seconds
      timeout: 5s # 5 seconds
      retries: 30
      start_period: 20s # 20 seconds
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  migrate:
    <<: *node-service
    restart: "no"
    command: [sh, infra/scripts/run-migrations.sh]
    environment:
      GROUNDTRUTH_POSTGRES_URL: postgresql://groundtruth:${GROUNDTRUTH_POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/groundtruth
      GROUNDTRUTH_CLICKHOUSE_URL: http://clickhouse:8123
      GROUNDTRUTH_CLICKHOUSE_DATABASE: groundtruth
      GROUNDTRUTH_CLICKHOUSE_USER: groundtruth
      GROUNDTRUTH_CLICKHOUSE_PASSWORD: ${GROUNDTRUTH_CLICKHOUSE_PASSWORD:-local-clickhouse-password}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    <<: *node-service
    restart: unless-stopped
    command: [node, apps/backend/dist/index.mjs]
    environment:
      GROUNDTRUTH_PORT: "3000"
      GROUNDTRUTH_PUBLIC_URL: http://localhost:${GROUNDTRUTH_API_PORT:-3000}
      GROUNDTRUTH_CONSOLE_ORIGIN: ${GROUNDTRUTH_CONSOLE_ORIGIN:-http://localhost:5173}
      GROUNDTRUTH_DEV_CONSOLE_ORIGIN: ${GROUNDTRUTH_DEV_CONSOLE_ORIGIN:-http://127.0.0.1:5173}
      GROUNDTRUTH_POSTGRES_URL: postgresql://groundtruth:${GROUNDTRUTH_POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/groundtruth
      GROUNDTRUTH_CLICKHOUSE_URL: http://clickhouse:8123
      GROUNDTRUTH_CLICKHOUSE_DATABASE: groundtruth
      GROUNDTRUTH_CLICKHOUSE_USER: groundtruth
      GROUNDTRUTH_CLICKHOUSE_PASSWORD: ${GROUNDTRUTH_CLICKHOUSE_PASSWORD:-local-clickhouse-password}
      GROUNDTRUTH_COLLECTOR_SECRET: ${GROUNDTRUTH_COLLECTOR_SECRET:-local-collector-service-secret}
      GROUNDTRUTH_SITE_HANDOFF_SECRET: ${GROUNDTRUTH_SITE_HANDOFF_SECRET:-local-sites-handoff-secret}
      GROUNDTRUTH_SESSION_SECRET: ${GROUNDTRUTH_SESSION_SECRET:-local-session-secret}
      GROUNDTRUTH_ADMIN_TOKEN: ${GROUNDTRUTH_ADMIN_TOKEN:-local-admin-token-change-before-sharing-1234}
      GROUNDTRUTH_COOKIE_SECURE: "false"
      GROUNDTRUTH_SANDBOX_SESSION_LIMIT: ${GROUNDTRUTH_SANDBOX_SESSION_LIMIT:-100}
      GROUNDTRUTH_SANDBOX_CREATIONS_PER_MINUTE: ${GROUNDTRUTH_SANDBOX_CREATIONS_PER_MINUTE:-10}
      GROUNDTRUTH_AUTHENTICATED_REQUESTS_PER_MINUTE: ${GROUNDTRUTH_AUTHENTICATED_REQUESTS_PER_MINUTE:-300}
      GROUNDTRUTH_PUBLIC_REQUESTS_PER_MINUTE: ${GROUNDTRUTH_PUBLIC_REQUESTS_PER_MINUTE:-10000}
      GROUNDTRUTH_BOOTSTRAP_INGEST_KEY: ${GROUNDTRUTH_DEMO_INGEST_KEY:-local-demo-ingest-key}
      GROUNDTRUTH_BOOTSTRAP_PROJECT_SLUG: local
      GROUNDTRUTH_BOOTSTRAP_PROJECT_NAME: Local project
    ports:
      - 127.0.0.1:${GROUNDTRUTH_API_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s # 5 seconds
      timeout: 3s # 3 seconds
      retries: 20
      start_period: 10s # 10 seconds
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  collector:
    <<: *service-runtime
    image: clear-collector:local
    build:
      context: ..
      dockerfile: apps/collector/Dockerfile
    restart: unless-stopped
    environment:
      GROUNDTRUTH_BACKEND_ENDPOINT: http://backend:3000
      GROUNDTRUTH_SERVICE_TOKEN: ${GROUNDTRUTH_COLLECTOR_SECRET:-local-collector-service-secret}
    ports:
      - 127.0.0.1:${GROUNDTRUTH_OTLP_GRPC_PORT:-4317}:4317
      - 127.0.0.1:${GROUNDTRUTH_OTLP_HTTP_PORT:-4318}:4318
      - 127.0.0.1:${GROUNDTRUTH_COLLECTOR_HEALTH_PORT:-13133}:13133
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  payments-stub:
    <<: *service-runtime
    image: groundtruth-payments-stub:local
    build:
      context: ..
      dockerfile: apps/payments-stub/Dockerfile
    restart: unless-stopped
    environment:
      <<: *example-telemetry
      PORT: "4102"
      OTEL_SERVICE_NAME: payments-stub
      SERVICE_TOKEN: ${GROUNDTRUTH_PAYMENTS_SERVICE_TOKEN:-local-payments-service-token}
      CONTROL_TOKEN: ${GROUNDTRUTH_PAYMENTS_CONTROL_TOKEN:-local-payments-control-token}
      FAILURE_RATE: "0"
      FAILURE_SEED: ${GROUNDTRUTH_SCENARIO_SEED:-groundtruth-retry-storm-v1}
      BASE_LATENCY_MS: "85" # 85 milliseconds
      LATENCY_JITTER_MS: "35" # 35 milliseconds
      EXPECTED_RPS: ${GROUNDTRUTH_PAYMENTS_EXPECTED_RPS:-51}
      OVERLOAD_GAIN: ${GROUNDTRUTH_PAYMENTS_OVERLOAD_GAIN:-0.22}
      OVERLOAD_LATENCY_MS: ${GROUNDTRUTH_PAYMENTS_OVERLOAD_LATENCY_MS:-35} # 35 milliseconds per excess request per second
    ports:
      - 127.0.0.1:${GROUNDTRUTH_PAYMENTS_PORT:-4102}:4102
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4102/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s # 5 seconds
      timeout: 3s # 3 seconds
      retries: 20
      start_period: 10s # 10 seconds
    depends_on:
      collector:
        condition: service_healthy
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  checkout-api:
    <<: *service-runtime
    image: groundtruth-checkout-api:local
    build:
      context: ..
      dockerfile: apps/checkout-api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *example-telemetry
      PORT: "4101"
      OTEL_SERVICE_NAME: checkout-api
      PAYMENTS_BASE_URL: http://payments-stub:4102
      PAYMENTS_SERVICE_TOKEN: ${GROUNDTRUTH_PAYMENTS_SERVICE_TOKEN:-local-payments-service-token}
      UPSTREAM_TIMEOUT_MS: "750" # 750 milliseconds
      GROUNDTRUTH_DEPLOY_EVENTS_URL: http://backend:3000/v1/events/deploy
      CHECKOUT_WEB_ORIGIN: ${GROUNDTRUTH_CHECKOUT_WEB_ORIGIN:-http://localhost:5174}
    ports:
      - 127.0.0.1:${GROUNDTRUTH_CHECKOUT_API_PORT:-4101}:4101
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4101/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s # 5 seconds
      timeout: 3s # 3 seconds
      retries: 20
      start_period: 10s # 10 seconds
    depends_on:
      backend:
        condition: service_healthy
      collector:
        condition: service_healthy
      payments-stub:
        condition: service_healthy
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  load-generator:
    <<: *service-runtime
    image: groundtruth-load-generator:local
    build:
      context: ..
      dockerfile: examples/load-generator/Dockerfile
    restart: unless-stopped
    environment:
      <<: *example-telemetry
      PORT: "4103"
      OTEL_SERVICE_NAME: load-generator
      CHECKOUT_BASE_URL: http://checkout-api:4101
      PAYMENTS_BASE_URL: http://payments-stub:4102
      PAYMENTS_CONTROL_TOKEN: ${GROUNDTRUTH_PAYMENTS_CONTROL_TOKEN:-local-payments-control-token}
      CONTROL_TOKEN: ${GROUNDTRUTH_LOAD_CONTROL_TOKEN:-local-load-control-token}
      SCENARIO_SEED: ${GROUNDTRUTH_SCENARIO_SEED:-groundtruth-retry-storm-v1}
      BASELINE_RPS: ${GROUNDTRUTH_BASELINE_RPS:-50}
      UNIQUE_USERS: ${GROUNDTRUTH_UNIQUE_USERS:-800}
      BASELINE_DURATION_MS: ${GROUNDTRUTH_BASELINE_DURATION_MS:-20000} # 20 seconds
      BLIP_DURATION_MS: ${GROUNDTRUTH_BLIP_DURATION_MS:-10000} # 10 seconds
      MAX_SCENARIO_DURATION_MS: ${GROUNDTRUTH_MAX_SCENARIO_DURATION_MS:-900000} # 15 minutes
      AUTOSTART: "false"
    ports:
      - 127.0.0.1:${GROUNDTRUTH_LOAD_GENERATOR_PORT:-4103}:4103
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4103/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s # 5 seconds
      timeout: 3s # 3 seconds
      retries: 20
      start_period: 10s # 10 seconds
    depends_on:
      collector:
        condition: service_healthy
      checkout-api:
        condition: service_healthy
      payments-stub:
        condition: service_healthy
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  postgres-data:
  clickhouse-data:

networks:
  app:
  data:
