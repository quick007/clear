user nginx;
worker_processes 1;
pid /run/nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr notice;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream clear_backend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    upstream clear_collector {
        server 127.0.0.1:4318;
        keepalive 8;
    }

    upstream clear_payments {
        server 127.0.0.1:4102;
        keepalive 8;
    }

    upstream clear_scenario {
        server 127.0.0.1:4103;
        keepalive 4;
    }

    server {
        listen 10000 default_server;
        server_name api.clear.seufert.sh _;

        location /internal/payments/ {
            proxy_pass http://clear_payments/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /internal/scenario/ {
            proxy_pass http://clear_scenario/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://clear_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }

    server {
        listen 10000;
        server_name otlp.clear.seufert.sh;

        location = /health {
            proxy_pass http://127.0.0.1:13133/healthz;
        }

        location / {
            proxy_pass http://clear_collector;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }
    }
}
