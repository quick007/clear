user nginx;
worker_processes 1;
pid /run/nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    log_format clear '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout clear;
    error_log /dev/stderr notice;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream clear_backend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    upstream clear_collector {
        server 127.0.0.1:4318;
        keepalive 8;
    }

    upstream clear_payments {
        server 127.0.0.1:4102;
        keepalive 8;
    }

    upstream clear_scenario {
        server 127.0.0.1:4103;
        keepalive 4;
    }

    server {
        listen 10001 default_server;
        server_name _;

        location ~ ^/v1/(metrics|logs|traces)$ {
            proxy_pass http://clear_collector;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }

        location /internal/payments/ {
            proxy_pass http://clear_payments/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /internal/scenario/ {
            proxy_pass http://clear_scenario/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://clear_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }

}
