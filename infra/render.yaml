# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

version: "1"

previews:
  generation: "off"

services:
  - type: web
    name: clear-runtime
    runtime: docker
    region: oregon
    plan: 1c-2g
    numInstances: 1
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - api.clear.seufert.sh
      - otlp.clear.seufert.sh
    renderSubdomainPolicy: enabled
    buildFilter:
      paths:
        - apps/backend/**
        - apps/collector/**
        - apps/load-generator/**
        - apps/payments-stub/**
        - infra/clickhouse/**
        - infra/docker/backend-entry.mjs
        - infra/render/**
        - infra/scripts/check-database-readiness.mjs
        - infra/scripts/run-migrations.sh
        - packages/**
        - Dockerfile
        - Dockerfile.dockerignore
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.json
        - vite.config.ts
    disk:
      name: clear-data
      mountPath: /var/lib
      sizeGB: 10
    envVars:
      - key: GROUNDTRUTH_PUBLIC_URL
        value: https://clear-runtime.onrender.com
      - key: GROUNDTRUTH_CONSOLE_ORIGIN
        value: https://clear-observability.seufert.chatgpt.site
      - key: GROUNDTRUTH_POSTGRES_PASSWORD
        generateValue: true
      - key: GROUNDTRUTH_CLICKHOUSE_PASSWORD
        generateValue: true
      - key: GROUNDTRUTH_COLLECTOR_SECRET
        generateValue: true
      - key: GROUNDTRUTH_SITE_HANDOFF_SECRET
        sync: false
      - key: GROUNDTRUTH_SESSION_SECRET
        generateValue: true
      - key: GROUNDTRUTH_DEMO_INGEST_KEY
        generateValue: true
      - key: SERVICE_TOKEN
        generateValue: true
      - key: CONTROL_TOKEN
        generateValue: true
      - key: PAYMENTS_CONTROL_TOKEN
        generateValue: true
      - key: GROUNDTRUTH_COOKIE_SECURE
        value: "true"
      - key: GROUNDTRUTH_SANDBOX_SESSION_LIMIT
        value: 100
      - key: GROUNDTRUTH_SANDBOX_CREATIONS_PER_MINUTE
        value: 10
      - key: GROUNDTRUTH_AUTHENTICATED_REQUESTS_PER_MINUTE
        value: 300
      - key: GROUNDTRUTH_PUBLIC_REQUESTS_PER_MINUTE
        value: 10000
      - key: GROUNDTRUTH_MIGRATION_MAX_ATTEMPTS
        value: 30
      - key: GROUNDTRUTH_MIGRATION_RETRY_DELAY_SECONDS
        value: 2 # 2 seconds, one minute total
      - key: FAILURE_RATE
        value: 0
      - key: FAILURE_SEED
        value: clear-retry-storm-v1
      - key: BASE_LATENCY_MS
        value: 85 # 85 milliseconds
      - key: LATENCY_JITTER_MS
        value: 35 # 35 milliseconds
      - key: EXPECTED_RPS
        value: 51
      - key: OVERLOAD_GAIN
        value: 0.22
      - key: OVERLOAD_LATENCY_MS
        value: 35 # 35 milliseconds per excess request per second
      - key: SCENARIO_SEED
        value: clear-retry-storm-v1
      - key: BASELINE_RPS
        value: 50
      - key: UNIQUE_USERS
        value: 800
      - key: BASELINE_DURATION_MS
        value: 20000 # 20 seconds
      - key: BLIP_DURATION_MS
        value: 10000 # 10 seconds
      - key: MAX_SCENARIO_DURATION_MS
        value: 900000 # 15 minutes
      - key: AUTOSTART
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=320

  - type: web
    name: clear-checkout-api
    runtime: docker
    region: oregon
    plan: free
    numInstances: 1
    dockerContext: .
    dockerfilePath: apps/checkout-api/Dockerfile
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    domains:
      - checkout-api.clear.seufert.sh
    renderSubdomainPolicy: enabled
    buildFilter:
      paths:
        - apps/checkout-api/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.json
        - vite.config.ts
    envVars:
      - key: PORT
        value: 10000
      - key: OTEL_SERVICE_NAME
        value: checkout-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://clear-runtime.onrender.com
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: GROUNDTRUTH_INGEST_KEY
        fromService:
          type: web
          name: clear-runtime
          envVarKey: GROUNDTRUTH_DEMO_INGEST_KEY
      - key: PAYMENTS_BASE_URL
        value: https://clear-runtime.onrender.com/internal/payments
      - key: PAYMENTS_SERVICE_TOKEN
        fromService:
          type: web
          name: clear-runtime
          envVarKey: SERVICE_TOKEN
      - key: UPSTREAM_TIMEOUT_MS
        value: 750 # 750 milliseconds
      - key: GROUNDTRUTH_DEPLOY_EVENTS_URL
        value: https://clear-runtime.onrender.com/v1/events/deploy
      - key: CHECKOUT_WEB_ORIGIN
        value: https://clear-checkout.seufert.chatgpt.site
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
