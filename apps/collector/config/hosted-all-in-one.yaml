extensions:
  health_check:
    endpoint: 127.0.0.1:13133
    path: /healthz
  groundtruth_auth:
    endpoint: http://127.0.0.1:3000
    service_token: ${env:GROUNDTRUTH_COLLECTOR_SECRET}
    cache_ttl: 1m
    cache_entries: 1024

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
        auth:
          authenticator: groundtruth_auth
        max_request_body_size: 8388608
        read_header_timeout: 5s
        read_timeout: 15s
        write_timeout: 20s
        idle_timeout: 1m

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  resource/project:
    attributes:
      - key: groundtruth.project.id
        from_context: metadata.groundtruth-project-id
        action: upsert
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
    metadata_keys:
      - groundtruth-project-id
      - groundtruth-ingest-key
    metadata_cardinality_limit: 256

exporters:
  groundtruth:
    endpoint: http://127.0.0.1:3000
    service_token: ${env:GROUNDTRUTH_COLLECTOR_SECRET}
    compression: none
    timeout: 5s
    max_request_size: 16777216
    retry_on_failure:
      enabled: true
      initial_interval: 250ms
      max_interval: 2s
      max_elapsed_time: 10s
    sending_queue:
      wait_for_result: true
      num_consumers: 1
      queue_size: 32
      block_on_overflow: false

service:
  extensions:
    - health_check
    - groundtruth_auth
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/project, batch]
      exporters: [groundtruth]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/project, batch]
      exporters: [groundtruth]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/project, batch]
      exporters: [groundtruth]
